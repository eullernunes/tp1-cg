name: build-windows

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: build
        run: pyinstaller --noconfirm tp1_algoritmos.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        working-directory: build
        run: iscc installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: TP1AlgoritmosCG-executable
          path: build/dist/TP1AlgoritmosCG/**

      - uses: actions/upload-artifact@v4
        with:
          name: TP1AlgoritmosCG-installer
          path: build/installer_output/*.exe

      - name: Zip the executable folder for public release download
        working-directory: build/dist
        run: Compress-Archive -Path TP1AlgoritmosCG -DestinationPath TP1AlgoritmosCG.zip

      - name: Publish a public download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Build mais recente (gerado automaticamente)
          body: Executavel e instalador Windows gerados automaticamente a partir do ultimo push. Sem necessidade de login no GitHub para baixar.
          make_latest: true
          files: |
            build/dist/TP1AlgoritmosCG.zip
            build/installer_output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
